# 启动配置。改完后重启服务生效。
# 优先级：环境变量 > 本文件 > 代码默认值。
# make / make api 会设 ADDR=:8080，仍会盖过这里的端口。
# 代理、无头、邀请链接、并发等也可以在网页「设置」里改，保存后以设置为准。

addr: ":9999"
data_dir: "./data"

invite_url: "https://authkit.cline.bot"
headless: true
slow_mo: 0
proxy: ""
max_concurrent: 1
max_retries: 3

login_engine: python
# login_python: "./worker/.venv/bin/python"

# 初始值。版本和 license 也可以在网页「设置 → 运行环境」里改，保存后以设置为准。
# 151 必须带 license，走官方 https://cloakbrowser.dev/api/download/{version}（Bearer）。
# 这是密钥，不要推到公开仓库。环境变量 CLOAKBROWSER_LICENSE_KEY 会盖过这里的初始值。
cloakbrowser_version: "151.0.7922.108.2"
cloakbrowser_cache_dir: ""
cloakbrowser_binary_path: ""
cloakbrowser_license_key: ""
