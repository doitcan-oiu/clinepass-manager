# 启动配置。改完后重启服务生效。
# 优先级：环境变量 > 本文件 > 代码默认值。
# make / make api 会设 ADDR=:8080，仍会盖过这里的端口。
# 代理、无头、邀请链接、并发等也可以在网页「设置」里改，保存后以设置为准。

addr: ":9999"
data_dir: "./data"

invite_url: "https://authkit.cline.bot"
headless: true
slow_mo: 0
proxy: ""
max_concurrent: 1
max_retries: 3

login_engine: python
# login_python: "./worker/.venv/bin/python"

# 151 是当前 Stable。没有 license 时官方包装只会下免费 146，AuthKit Radar 更容易拦。
# 换 key 改这一项后重启服务。环境变量 CLOAKBROWSER_LICENSE_KEY 会盖过这里。
# 这是密钥，不要推到公开仓库。
cloakbrowser_version: "151.0.7922.108.2"
cloakbrowser_cache_dir: ""
cloakbrowser_binary_path: ""
cloakbrowser_license_key: ""
