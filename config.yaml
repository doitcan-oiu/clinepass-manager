# 启动配置。改完后重启服务生效。
# 优先级：环境变量 > 本文件 > 代码默认值。
# make / make api 会设 ADDR=:8080，仍会盖过这里的端口。
# 代理、无头、邀请链接、并发等也可以在网页「设置」里改，保存后以设置为准。

addr: ":9999"
data_dir: "./data"

invite_url: "https://authkit.cline.bot"
headless: true
slow_mo: 0
proxy: ""
max_concurrent: 1
max_retries: 3

login_engine: python
# login_python: "./worker/.venv/bin/python"

cloakbrowser_version: "146.0.7680.177.5"
cloakbrowser_cache_dir: ""
cloakbrowser_binary_path: ""
cloakbrowser_license_key: ""
